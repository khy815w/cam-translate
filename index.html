<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>화면 답변기</title>
<!-- 첫 요청 때 TLS 연결 시간을 아끼려고 미리 연결 -->
<link rel="preconnect" href="https://api.anthropic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  :root {
    --bg: #0b0d10; --surface: #14171c; --surface-2: #1c2027; --line: #2a3039;
    --text: #eef1f5; --muted: #8d96a5; --accent: #7aa2ff; --accent-ink: #0b0d10;
    --ok: #3ecf8e; --warn: #f5b84a; --err: #ff6b6b;
    --font: 20px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef0f3; --line: #dfe3e8;
      --text: #14171c; --muted: #5b6473; --accent: #3260e6; --accent-ink: #ffffff;
      --ok: #12a46a; --warn: #b97c0c; --err: #d64545;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%; }
  body { overscroll-behavior: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  #app { height: 100dvh; display: grid; grid-template-rows: auto auto 1fr;
    grid-template-areas: "bar" "cam" "result";
    padding-top: env(safe-area-inset-top); }

  /* ── 상단 상태줄 ── */
  .bar { grid-area: bar; display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 16px; min-height: 48px; }
  .status { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot[data-s="watch"] { background: var(--ok); }
  .dot[data-s="detect"] { background: var(--warn); }
  .dot[data-s="send"], .dot[data-s="stream"] { background: var(--accent); animation: pulse 0.9s ease-in-out infinite; }
  .dot[data-s="done"] { background: var(--ok); }
  .dot[data-s="error"] { background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }
  .metrics { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .icon-btn:active { background: var(--surface-2); }
  .icon-btn svg { width: 22px; height: 22px; stroke: var(--text); }

  /* ── 카메라 ── */
  .cam { grid-area: cam; position: relative; height: 34dvh; background: #000; overflow: hidden; transition: height .2s ease; touch-action: manipulation; }
  .cam.small { height: 16dvh; }
  .cam video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cam .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .cam .flash.on { animation: flash .25s ease-out; }
  @keyframes flash { from { opacity: .35; } to { opacity: 0; } }
  .chip { position: absolute; border: 0; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 650;
    background: rgba(0,0,0,.55); color: #fff; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .chip[aria-pressed="true"] { background: rgba(62,207,142,.85); color: #06140d; }
  #btnAuto { left: 12px; top: 10px; }
  #btnCamSize { left: 12px; bottom: 12px; }
  .meter { position: absolute; left: 12px; right: 92px; top: 48px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); overflow: hidden; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #fff; transition: width .1s linear; }
  .meter b { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: var(--warn); }
  .shutter { position: absolute; right: 14px; bottom: 12px; width: 66px; height: 66px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.9); background: var(--accent); color: var(--accent-ink); font-weight: 750; font-size: 15px;
    box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  .shutter:active { transform: scale(.94); }
  .start { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; padding: 16px;
    background: radial-gradient(ellipse at center, #1a1f27 0%, #000 75%); color: #fff; }
  .start button { border: 0; border-radius: 14px; padding: 14px 22px; font-size: 17px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
  .start p { margin: 0; font-size: 13px; color: #aab3c0; max-width: 300px; line-height: 1.5; }

  /* ── 결과 ── */
  .result { grid-area: result; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px 16px calc(28px + env(safe-area-inset-bottom)); }
  .out { font-size: var(--font); line-height: 1.72; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; min-height: 3em; }
  .out:empty::before { content: attr(data-placeholder); color: var(--muted); font-size: 16px; }
  .out.streaming::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .out .err { display: block; color: var(--err); font-size: 16px; }
  .meta { margin-top: 12px; color: var(--muted); font-size: 12.5px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .history { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 10px; }
  .history summary { color: var(--muted); font-size: 14px; padding: 8px 0; list-style: none; }
  .history summary::-webkit-details-marker { display: none; }
  .history ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .history li { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 10px; border-radius: 12px; background: var(--surface); }
  .history img { width: 64px; border-radius: 6px; display: block; }
  .history .h-text { font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .history li.open .h-text { -webkit-line-clamp: unset; display: block; }
  .history .h-meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  /* ── 설정 ── */
  dialog { border: 0; padding: 0; width: 100%; max-width: 560px; max-height: 92dvh; margin: auto auto 0; border-radius: 18px 18px 0 0;
    background: var(--surface); color: var(--text); }
  @media (min-width: 600px) { dialog { margin: auto; border-radius: 18px; } }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .sheet { padding: 18px 16px 0; display: grid; gap: 18px; overflow-y: auto; max-height: 92dvh; }
  .sheet h2 { margin: 0; font-size: 18px; }
  .notice { margin: 0; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 18%, transparent); font-size: 14px; white-space: pre-line; overflow-wrap: anywhere; }
  .notice:empty { display: none; }
  .field { display: grid; gap: 8px; }
  .field > span { font-size: 14px; font-weight: 650; }
  .field small { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  input[type=password], input[type=text], select, textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  textarea { min-height: 84px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; }
  .seg { display: grid; gap: 6px; }
  .seg label { display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
  .seg label:has(input:checked) { border-color: var(--accent); }
  .seg input { margin-top: 3px; accent-color: var(--accent); }
  .seg b { display: block; font-size: 15px; }
  .seg em { font-style: normal; color: var(--muted); font-size: 12.5px; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .switch input { width: 22px; height: 22px; accent-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 11px 14px; font-weight: 650; white-space: nowrap; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; position: sticky; bottom: 0; margin: 0 -16px; padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 1px solid var(--line); }

  /* 가로 화면: 카메라 왼쪽, 답변 오른쪽 */
  @media (orientation: landscape) and (max-height: 600px) {
    #app { grid-template-columns: 44% 1fr; grid-template-rows: auto 1fr; grid-template-areas: "bar bar" "cam result"; }
    .cam, .cam.small { height: auto; }
    #btnCamSize { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">시작 전</span></div>
    <div class="metrics" id="metrics"></div>
    <button class="icon-btn" id="btnSettings" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <section class="cam" id="cam" aria-label="카메라 화면. 탭하면 바로 답변">
    <video id="video" playsinline muted autoplay></video>
    <div class="flash" id="flash"></div>
    <button class="chip" id="btnAuto" aria-pressed="true">자동 감지</button>
    <div class="meter" title="화면 변화량 (노란 선을 넘으면 새 문제로 판단)"><i id="meterFill"></i><b></b></div>
    <button class="chip" id="btnCamSize">미리보기 작게</button>
    <button class="shutter" id="btnShoot" aria-label="지금 답변">답변</button>
    <div class="start" id="startOverlay">
      <button id="btnStart">카메라 시작</button>
      <p>노트북 화면을 비추면 새 문제가 뜰 때마다 자동으로 답을 알려줘요. 화면을 탭하면 즉시 답변해요.</p>
      <p>휴대폰을 거치대나 컵에 기대 고정하면 새 문제 감지가 훨씬 정확해요.</p>
    </div>
  </section>

  <main class="result" id="result">
    <div class="out" id="out" data-placeholder="답변이 여기에 나와요."></div>
    <div class="meta" id="meta"></div>
    <details class="history" id="history" hidden>
      <summary>이전 답변 <span id="histCount"></span></summary>
      <ol id="histList"></ol>
    </details>
  </main>
</div>

<dialog id="settings">
  <form class="sheet" method="dialog" id="settingsForm">
    <h2>설정</h2>
    <p class="notice" id="settingsNotice"></p>

    <label class="field">
      <span>Anthropic API 키</span>
      <div class="row">
        <input type="password" id="inKey" placeholder="sk-ant-…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" class="btn" id="btnShowKey">보기</button>
      </div>
      <small>이 휴대폰 브라우저에만 저장되고 api.anthropic.com으로만 보내져요. console.anthropic.com에서 이 용도 전용 키를 만들고 월 사용 한도를 걸어두는 걸 권해요.</small>
    </label>

    <div class="field">
      <span>모델</span>
      <div class="seg" id="modelSeg"></div>
    </div>

    <label class="field">
      <span>답변 방식</span>
      <select id="inPreset">
        <option value="brief">정답 + 짧은 근거</option>
        <option value="only">정답만</option>
        <option value="explain">정답 + 자세한 풀이</option>
        <option value="custom">직접 입력</option>
      </select>
      <textarea id="inCustom" placeholder="예: 각 문제의 정답을 쓰고, 문제에 나온 어려운 단어 3개를 뜻과 함께 정리한다." hidden></textarea>
    </label>

    <label class="field">
      <span>생각 깊이</span>
      <select id="inEffort">
        <option value="low">빠르게 · 쉬운 문제</option>
        <option value="medium">보통 (권장)</option>
        <option value="high">꼼꼼하게 · 어려운 문제</option>
      </select>
      <small>깊게 생각할수록 정답률이 오르지만 답이 늦게 나오고 비용이 늘어요.</small>
    </label>

    <div class="field">
      <div class="switch"><span>자동 감지 (새 문제가 뜨면 자동 답변)</span><input type="checkbox" id="inAuto"></div>
      <label class="field">
        <small>민감도 <b id="sensVal"></b> — 높을수록 작은 화면 변화에도 반응해요. 같은 문제에 자꾸 다시 답하면 낮추고, 새 문제를 놓치면 올리세요. 손에 들고 찍으면 큰 변화만 잡히니, 휴대폰을 고정하거나 화면을 탭해서 직접 답변을 받으세요.</small>
        <input type="range" id="inSens" min="1" max="10" step="1">
      </label>
    </div>

    <label class="field">
      <span>보내는 사진 크기</span>
      <select id="inRes">
        <option value="1280">1280px · 가장 빠름</option>
        <option value="1600">1600px · 균형 (권장)</option>
        <option value="2048">2048px · 작은 글씨용</option>
      </select>
      <small>클수록 작은 글씨를 잘 읽지만 전송과 처리가 느려져요.</small>
    </label>

    <label class="field">
      <span>글자 크기 <b id="fontVal"></b></span>
      <input type="range" id="inFont" min="14" max="34" step="1">
    </label>

    <label class="field">
      <span>카메라 대신 사진으로 시험해보기</span>
      <input type="file" id="inTestFile" accept="image/*">
      <small>카메라가 없거나 API 키가 잘 되는지 확인할 때 써요.</small>
    </label>

    <div class="field">
      <span>이번 접속 누적 비용 (추정)</span>
      <div class="row"><b id="costVal" style="flex:1">$0.000</b><button type="button" class="btn" id="btnResetCost">초기화</button></div>
    </div>

    <div class="actions">
      <button class="btn primary" value="save" id="btnSave">저장</button>
    </div>
  </form>
</dialog>

<script type="module">
import Anthropic from "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.5.0/+esm";

/* ───────── 설정값 ───────── */
// 가격: 100만 토큰당 USD (2026-11 기준). 비용 표시는 추정치.
const MODELS = {
  opus:   { id: "claude-opus-5-5",   name: "Opus 5.5 · 빠른 모드", desc: "가장 정확함. 빠른 모드로 출력 속도를 올림 (비용 2배)",
            fast: true, fallbacks: true, price: { in: 4, out: 20 }, fastPrice: { in: 8, out: 40 } },
  sonnet: { id: "claude-sonnet-5-5", name: "Sonnet 5.5", desc: "정확도와 속도의 중간",
            fallbacks: true, price: { in: 2, out: 10 } },
  haiku:  { id: "claude-haiku-5-5",  name: "Haiku 5.5 · 최고 속도", desc: "가장 빠르고 아주 저렴함. 어려운 문제는 가끔 틀릴 수 있음",
            thinkingOff: true, price: { in: 0.1, out: 0.5 } },
};
const PRESETS = {
  brief: "각 문제마다 정답을 먼저 쓰고, 바로 아래에 왜 그 답인지 근거를 1~2문장으로 붙인다.",
  only: "각 문제의 정답만 쓴다. 근거나 풀이는 붙이지 않는다.",
  explain: "각 문제마다 정답을 먼저 쓰고, 이어서 풀이 과정을 단계별로 설명한다. 객관식이면 다른 보기가 왜 틀렸는지도 짧게 짚는다.",
};
const EFFORTS = ["low", "medium", "high"];
const DEFAULTS = { model: "opus", preset: "brief", custom: "", effort: "medium", auto: true, sens: 6, res: 1600, font: 20, camSmall: false };
const SYSTEM_BASE = [
  "너는 실시간 문제 풀이 도우미다. 입력 이미지는 휴대폰 카메라로 노트북 화면을 찍은 사진이다.",
  "화면 속 문제(질문)와 그 문제에 딸린 지문·보기·표·그림을 찾아 읽는다. 메뉴, 탭, 주소창, 작업 표시줄, 버튼, 반사광, 화면 밖 물체는 무시한다.",
  "지문을 번역하거나 옮겨 적지 말고, 문제를 풀어 답을 한다. 설명은 한국어로 쓰되, 답 자체가 외국어여야 하는 문제(영작, 빈칸 채우기 등)는 그 언어로 답한다.",
  "객관식이면 보기 번호와 보기 내용을 함께 쓴다. 예: 정답: ③ 보기 내용",
  "문제가 여러 개면 문제 번호 순서대로 각각 답한다.",
  "머리말, 인사, 문제 다시 옮겨 적기 없이 정답부터 바로 쓴다. 화면에 그대로 표시되므로 **, # 같은 마크다운 기호는 쓰지 않는다.",
  "흐리거나 잘려서 답에 필요한 부분을 읽을 수 없으면 그 사실을 한 줄로 밝히고, 읽을 수 있는 내용으로 가장 가능성 높은 답을 고른다.",
  "화면에 풀 문제나 질문이 없으면 정확히 '(문제 없음)'만 출력한다.",
].join("\n");

/* ───────── 저장소 (실패해도 동작) ───────── */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let settings = { ...DEFAULTS, ...(JSON.parse(store.get("ct.settings") || "{}") || {}) };
if (!MODELS[settings.model]) settings.model = DEFAULTS.model;
if (!PRESETS[settings.preset] && settings.preset !== "custom") settings.preset = DEFAULTS.preset; // 예전 번역 설정은 답변 방식으로 바꿈

/* ───────── DOM ───────── */

  if (/^apikey_/i.test(k)) return "지금 넣은 건 API 키가 아니라 키 ID(" + keyHint(k) + ")예요. 진짜 API 키는 sk-ant-로 시작하는 100자쯤 되는 긴 글자예요.\n" + fix;

/* ───────── 카메라 ───────── */

      : "카메라는 https 주소에서만 열려요.";

async function useStream(s) {

}

  else stopLoop();

/* ───────── 새 문제 감지 ─────────
   192px 흑백 축소본에서 글자 윤곽(디테일)만 남겨 직전 프레임과 비교한다(손떨림만큼 위치를 맞춘 뒤).
   - 평소 흔들림 수준보다 갑자기 크게 바뀐 순간 = 새 문제 후보(dirty)
   - 그 뒤 화면이 STABLE_MS 동안 멈추면 전송
   - 보내기 직전, 마지막으로 보낸 화면과 거의 같으면(오탐) 건너뜀
   휴대폰을 고정하면 비슷한 레이아웃의 문제 교체도 잡고, 손에 들면 큰 변화 위주로 잡는다. */
const SIG_LONG = 192, R = 3, TICK = 110, STABLE_MS = 250, SHAKY = 0.08;
const sigCanvas = document.createElement("canvas");
const sigCtx = sigCanvas.getContext("2d", { willReadFrequently: true });

const dbg = {}; // 감지 수치 (개발자 도구에서 window.app.dbg 로 확인)
const flipMin = () => Math.max(0.012, 0.075 - 0.0075 * settings.sens); // 민감도 6 → 0.03

function resetDetector() { prevD = null; lastSentD = null; base = null; dirty = true; stableMs = 0; }
function ensureSize() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const w = vw >= vh ? SIG_LONG : Math.round(SIG_LONG * vw / vh);
  const h = vw >= vh ? Math.round(SIG_LONG * vh / vw) : SIG_LONG;
  if (w === SW && h === SH) return;
  SW = w; SH = h; sigCanvas.width = w; sigCanvas.height = h;
  sigCtx.imageSmoothingQuality = "high"; // 축소할 때 글자가 깨져 보이지 않게(손떨림 오탐 감소)
  const n = w * h; gBuf = new Float32Array(n); tBuf = new Float32Array(n); b1 = new Float32Array(n); b2 = new Float32Array(n);
  prevD = null; lastSentD = null; base = null;

function boxBlur(src, dst, r) { // 분리형 박스 블러 (가로 → 세로)
  const W = SW, H = SH, k = 2 * r + 1;
  for (let y = 0; y < H; y++) {
    const row = y * W; let s = 0;
    for (let x = -r; x <= r; x++) s += src[row + Math.min(W - 1, Math.max(0, x))];
    for (let x = 0; x < W; x++) { tBuf[row + x] = s / k; s += src[row + Math.min(W - 1, x + r + 1)] - src[row + Math.max(0, x - r)]; }
  }
  for (let x = 0; x < W; x++) {
    let s = 0;
    for (let y = -r; y <= r; y++) s += tBuf[Math.min(H - 1, Math.max(0, y)) * W + x];
    for (let y = 0; y < H; y++) { dst[y * W + x] = s / k; s += tBuf[Math.min(H - 1, y + r + 1) * W + x] - tBuf[Math.max(0, y - r) * W + x]; }

function readDetail() {

  for (let i = 0, j = 0; i < n; i++, j += 4) gBuf[i] = px[j] * 0.299 + px[j + 1] * 0.587 + px[j + 2] * 0.114;

function cmpAt(a, b, dx, dy, step) {

// 위치를 ±R 픽셀 맞춘 뒤의 상대 차이 (0 = 같음, 0.5 이상 = 전혀 다름). edge = 카메라가 크게 움직임

function startLoop() { if (!loopTimer && mediaStream) { lastTick = performance.now(); loopTimer = setInterval(tick, TICK); } }
function stopLoop() { clearInterval(loopTimer); loopTimer = null; }
function tick() {

  if (!settings.auto || !apiKey) return;
  if (dirty && !busy() && dot.dataset.s !== "detect" && dot.dataset.s !== "error") setStatus("detect", "변화 감지");
  if (dirty && stableMs >= STABLE_MS && now - lastSendAt > (shaky ? 2500 : 900)) {

/* ───────── 촬영 & 전송 ───────── */
const capCanvas = document.createElement("canvas"), capCtx = capCanvas.getContext("2d");
const thumbCanvas = document.createElement("canvas"), thumbCtx = thumbCanvas.getContext("2d");
function captureFrame() {
  const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return null;
  const scale = Math.min(1, settings.res / Math.max(vw, vh));
  const w = Math.round(vw * scale), h = Math.round(vh * scale);
  capCanvas.width = w; capCanvas.height = h;
  capCtx.drawImage(video, 0, 0, w, h);
  const url = capCanvas.toDataURL("image/jpeg", 0.82);
  thumbCanvas.width = 128; thumbCanvas.height = Math.round(128 * h / w);
  thumbCtx.drawImage(capCanvas, 0, 0, thumbCanvas.width, thumbCanvas.height);
  const b64 = url.slice(url.indexOf(",") + 1);
  return { b64, w, h, kb: Math.round(b64.length * 0.75 / 1024), thumb: thumbCanvas.toDataURL("image/jpeg", 0.6) };
}
function trigger(sig) {
  if (!mediaStream) return;
  if (!apiKey) { openSettings("답변을 받으려면 API 키를 넣어주세요."); return; }
  const frame = captureFrame(); if (!frame) return;
  lastSentD = sig || readDetail(); dirty = false;
  lastSendAt = performance.now();
  const f = $("flash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
  send(frame);
}

let current = null, seq = 0, sessionCost = 0, compat = false, fastBlockedUntil = 0;
const pastJobs = [];
const busy = () => !!current && !current.done;

function buildSystem() {
  const instr = settings.preset === "custom" && settings.custom.trim() ? settings.custom.trim() : PRESETS[settings.preset] || PRESETS.brief;
  return SYSTEM_BASE + "\n" + instr;
}
function buildParams(m, frame, opt) {
  const p = {
    model: m.id,
    max_tokens: 32000, // 깊게 생각하면 생각 토큰도 여기에 포함되므로 넉넉히
    system: buildSystem(),
    output_config: { effort: settings.effort }, // 낮을수록 빨리, 높을수록 꼼꼼히 풂
    messages: [{ role: "user", content: [
      { type: "image", source: { type: "base64", media_type: "image/jpeg", data: frame.b64 } },
      { type: "text", text: "이 사진 속 노트북 화면의 문제를 풀어서 답해줘." },
    ] }],
  };
  // Haiku는 '빠르게'일 때만 생각을 끔 (Opus 5.5·Sonnet 5.5는 끌 수 없고 effort로만 조절)
  if (m.thinkingOff && settings.effort === "low") p.thinking = { type: "disabled" };
  if (opt.fast) p.speed = "fast";

}

async function send(frame) {
  if (current && current.done && current.text && !current.error) pushHistory(current);
  if (current && !current.done) { current.aborted = true; current.stream?.abort(); }
  const m = MODELS[settings.model];
  const job = { id: ++seq, t0: performance.now(), tFirst: 0, text: "", frame, model: m, done: false, aborted: false, stream: null };
  current = job;
  out.textContent = ""; out.classList.add("streaming"); meta.textContent = "";
  $("result").scrollTop = 0;
  setStatus("send", "전송 중"); metrics.textContent = frame.kb + "KB";

  let opt = { fast: !!m.fast && !compat && Date.now() > fastBlockedUntil, extras: !compat };
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const msg = await runStream(job, m, opt, frame);
      if (attempt > 0 && !opt.extras) compat = true; // 빠른모드/폴백 없이만 되는 계정이면 이후 생략
      finishJob(job, msg, opt);
      return;
    } catch (err) {
      if (job.aborted || err instanceof Anthropic.APIUserAbortError) return;
      if (attempt === 0 && !job.text && err instanceof Anthropic.RateLimitError && opt.fast) {
        fastBlockedUntil = Date.now() + 60_000; opt = { ...opt, fast: false }; continue; // 빠른 모드 한도 → 일반 속도로 즉시 재시도
      }
      if (attempt === 0 && !job.text && err instanceof Anthropic.BadRequestError && (opt.fast || (opt.extras && m.fallbacks))) {
        opt = { fast: false, extras: false }; continue; // 계정이 빠른 모드·폴백을 못 쓰면 기본 요청으로 재시도
      }
      failJob(job, err);
      return;
    }

}

async function runStream(job, m, opt, frame) {
  const c = getClient();
  const params = buildParams(m, frame, opt);
  // 빠른 모드 429는 SDK가 기다렸다 재시도하지 않게 하고, 바로 일반 속도로 다시 보냄
  const reqOpts = { maxRetries: opt.fast ? 0 : 1 };
  const stream = opt.extras && m.fallbacks
    ? c.beta.messages.stream({ ...params, betas: ["server-side-fallback-2026-07-01"], fallbacks: "default" }, reqOpts)
    : c.messages.stream(params, reqOpts);

  stream.on("connect", () => { if (job === current && !job.tFirst) setStatus("stream", "읽는 중"); });
  stream.on("streamEvent", (ev) => { // 답을 쓰기 전 생각하는 동안 표시
    if (job === current && !job.tFirst && ev.type === "content_block_start" && ev.content_block.type === "thinking") setStatus("stream", "생각 중");

    if (job !== current) return;
    if (!job.tFirst) { job.tFirst = performance.now(); setStatus("stream", "답변 중"); }

}

let rafPending = false;
function scheduleRender() {
  if (rafPending) return; rafPending = true;

    rafPending = false;
    if (!current || current.done) return; // 끝난 뒤엔 finishJob/failJob이 최종 화면을 그림
    out.textContent = current.text;
    if (current.tFirst) metrics.textContent = "첫 글자 " + fmtS(current.tFirst - current.t0);
  });

function finishJob(job, msg, opt) {

  if (msg.stop_reason === "refusal") {
    const e = document.createElement("span"); e.className = "err";
    e.textContent = (job.text ? "\n" : "") + "모델이 이 화면의 문제에 답하지 않았어요.";
    out.append(e);
  } else if (msg.stop_reason === "max_tokens") {
    out.append("\n…(길이 제한으로 잘림)");

    job.frame.w + "×" + job.frame.h + " " + job.frame.kb + "KB",
    "입력 " + (u.input_tokens || 0).toLocaleString() + " / 출력 " + (u.output_tokens || 0).toLocaleString() + " 토큰",
    "이번 " + fmtUSD(cost) + " · 누적 " + fmtUSD(sessionCost),

}

function errorMessage(err) {

  if (err instanceof Anthropic.NotFoundError) return "모델을 찾을 수 없어요(404). 설정에서 다른 모델을 골라보세요.";
  if (err instanceof Anthropic.RateLimitError) return "요청 한도를 넘었어요(429). 잠시 후 다시 시도하거나 민감도를 낮춰주세요.";
  if (err instanceof Anthropic.BadRequestError) return "요청 오류(400): " + (err.error?.error?.message || err.message);
  if (err instanceof Anthropic.InternalServerError) return "Anthropic 서버가 혼잡해요(" + err.status + "). 잠시 후 다시 시도해요.";
  if (err instanceof Anthropic.APIConnectionError) return "네트워크 연결을 확인해 주세요.";

}

  if (job !== current) return;
  out.classList.remove("streaming");
  out.textContent = job.text;
  const e = document.createElement("span"); e.className = "err"; e.textContent = (job.text ? "\n" : "") + errorMessage(err);
  out.append(e);
  setStatus("error", "오류");
  if (err instanceof Anthropic.AuthenticationError) openSettings(authErrMsg());
}

/* ───────── 이전 답변 ───────── */
function pushHistory(job) {
  pastJobs.unshift({ text: job.text, thumb: job.frame.thumb, at: new Date(), ttft: job.ttft, total: job.total });
  if (pastJobs.length > 20) pastJobs.pop();
  const list = $("histList"); list.textContent = "";
  for (const h of pastJobs) {
    const li = document.createElement("li");
    const img = document.createElement("img"); img.src = h.thumb; img.alt = "";
    const box = document.createElement("div");
    const t = document.createElement("div"); t.className = "h-text"; t.textContent = h.text;
    const mm = document.createElement("div"); mm.className = "h-meta";
    mm.textContent = h.at.toLocaleTimeString("ko-KR") + (h.total ? " · " + fmtS(h.total) : "");
    box.append(t, mm); li.append(img, box);
    li.addEventListener("click", () => li.classList.toggle("open"));
    list.append(li);
  }
  $("history").hidden = false; $("histCount").textContent = "(" + pastJobs.length + ")";
}

/* ───────── 설정 화면 ───────── */
function renderModelSeg() {
  const seg = $("modelSeg"); seg.textContent = "";
  for (const [key, m] of Object.entries(MODELS)) {
    const label = document.createElement("label");
    const r = document.createElement("input"); r.type = "radio"; r.name = "model"; r.value = key; r.checked = settings.model === key;
    const box = document.createElement("span");
    const b = document.createElement("b"); b.textContent = m.name;
    const em = document.createElement("em"); em.textContent = m.desc + " · $" + (m.fastPrice || m.price).in + " / $" + (m.fastPrice || m.price).out + " (100만 토큰당 입력/출력)";
    box.append(b, em); label.append(r, box); seg.append(label);
  }
}
function openSettings(notice = "") {
  $("settingsNotice").textContent = notice;
  dlg.returnValue = "";
  $("inKey").value = apiKey;
  renderModelSeg();
  $("inPreset").value = settings.preset; $("inCustom").value = settings.custom; $("inCustom").hidden = settings.preset !== "custom";
  $("inEffort").value = settings.effort;
  $("inAuto").checked = settings.auto; $("inSens").value = settings.sens; $("sensVal").textContent = settings.sens;
  $("inRes").value = String(settings.res); $("inFont").value = settings.font; $("fontVal").textContent = settings.font + "px";
  $("costVal").textContent = fmtUSD(sessionCost);
  if (!dlg.open) dlg.showModal();
}
$("inPreset").addEventListener("change", (e) => { $("inCustom").hidden = e.target.value !== "custom"; });
$("inSens").addEventListener("input", (e) => { $("sensVal").textContent = e.target.value; });
$("inFont").addEventListener("input", (e) => { $("fontVal").textContent = e.target.value + "px"; document.documentElement.style.setProperty("--font", e.target.value + "px"); });
$("btnShowKey").addEventListener("click", () => { const k = $("inKey"); k.type = k.type === "password" ? "text" : "password"; $("btnShowKey").textContent = k.type === "password" ? "보기" : "숨기기"; });
$("btnResetCost").addEventListener("click", () => { sessionCost = 0; $("costVal").textContent = fmtUSD(0); });
$("inTestFile").addEventListener("change", async (e) => {
  const file = e.target.files?.[0]; if (!file) return;
  const img = await createImageBitmap(file);
  const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
  c.getContext("2d").drawImage(img, 0, 0);
  const s = c.captureStream(2);
  // 정지 화면도 프레임이 계속 나오게 주기적으로 다시 그림
  const redraw = setInterval(() => { if (mediaStream !== s) return clearInterval(redraw); c.getContext("2d").drawImage(img, 0, 0); }, 500);
  dlg.close("save");
  await useStream(s);
});
function applySettingsFromForm() {
  const newKey = $("inKey").value.replace(/\s+/g, ""); // 붙여넣을 때 섞여 들어온 줄바꿈·공백 제거
  const bad = badKeyMsg(newKey); // 키 ID·가려진 키처럼 키가 아닌 걸 넣었으면 저장하지 않고 알려줌
  if (!bad && newKey !== apiKey) { apiKey = newKey; store.set("ct.key", apiKey); warmUp(); }
  if (bad) setTimeout(() => openSettings(bad), 0);
  const sel = document.querySelector('input[name="model"]:checked');
  if (sel) settings.model = sel.value;
  settings.preset = $("inPreset").value; settings.custom = $("inCustom").value; settings.effort = $("inEffort").value;
  settings.auto = $("inAuto").checked; settings.sens = +$("inSens").value;
  settings.res = +$("inRes").value; settings.font = +$("inFont").value;
  saveSettings(); applySettings();
}
dlg.addEventListener("close", () => { if (dlg.returnValue === "save") applySettingsFromForm(); else applySettings(); });

function applySettings() {
  document.documentElement.style.setProperty("--font", settings.font + "px");
  $("btnAuto").setAttribute("aria-pressed", String(settings.auto));
  $("btnAuto").textContent = settings.auto ? "자동 감지 켬" : "자동 감지 끔";
  $("cam").classList.toggle("small", settings.camSmall);
  $("btnCamSize").textContent = settings.camSmall ? "미리보기 크게" : "미리보기 작게";
  if (mediaStream && !busy() && dot.dataset.s !== "error") setStatus(settings.auto ? "watch" : "done", settings.auto ? "감시 중" : "수동 모드");
}

/* ───────── 버튼 ───────── */
$("btnStart").addEventListener("click", startCamera);
$("btnSettings").addEventListener("click", () => openSettings());
$("cam").addEventListener("click", (e) => { if (e.target === video || e.target.id === "cam" || e.target.id === "flash") trigger(); });
$("btnShoot").addEventListener("click", (e) => { e.stopPropagation(); trigger(); });
$("btnAuto").addEventListener("click", (e) => {
  e.stopPropagation(); settings.auto = !settings.auto; saveSettings(); applySettings();
  if (settings.auto) { lastSentD = readDetail(); dirty = false; } // 켠 순간 화면은 이미 본 것으로 간주
});
$("btnCamSize").addEventListener("click", (e) => { e.stopPropagation(); settings.camSmall = !settings.camSmall; saveSettings(); applySettings(); });

applySettings();
setStatus("idle", "시작 전");
// 개발자 도구에서 테스트용으로만 사용
window.app = { useStream, trigger, dbg, get settings() { return settings; }, get compat() { return compat; } };
</script>
</body>
